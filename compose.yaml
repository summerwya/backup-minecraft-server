services:
    backup:
        container_name: backup-mc-server
        image: summerwya/backup-mc-server
        build: .
        volumes:
            - ./mc-data:/app/data-folder:ro # this is the folder where server.properties is located in
            - ./backups:/app/backups-folder # Set this to where you want your backups to be in
        environment:
            RCON_HOST: "server"
            RCON_PORT: 25575
            RCON_BACKUP_MESSAGE: "Performing Automated Server Backup - Please rejoin after 5 minutes or so"
            
            DOCKER_PROJECT_NAME: "minecraft-server" # Get this from Docker Desktop, it should be the one that parents all of your services
            DOCKER_SERVICES: "" # separated by spaces, which docker services to stop, leave blank for all
        secrets:
            - rcon_password

secrets:
    rcon_password:
        file: ./rcon_password.txt