# Example of what your backup service should look like

services:
    backup:
        image: summerwya/backup-mc-server
        volumes:
            - ./mc-data:/app/data-folder:ro
            - ./backups:/app/backups-folder
        environment:
            # You must configure your server to have rcon if you want messages to work
            RCON_HOST: "main" # leave blank for no message
            # RCON_PORT: 25575 # Excluded because it already defaults to 25575
            
            # Enter your docker container information here
            # DOCKER_DAEMON_ADDRESS: host.docker.internal:2375 # excluded because it's already the default
            DOCKER_PROJECT_NAME: "minecraft-server"
            DOCKER_SERVICES: "main"
            
            # Backup options
            # BACKUP_TYPE: "tarball" # Please check README.md for backup types, tarball is the default already
            BACKUP_DELAY: "5m" # broadcast a message to all active players 5 minutes before the backup
            BACKUP_KICK_MESSAGE: "Performing Automated Server Backup - Please rejoin after 5 minutes or so"
            BACKUP_LIMIT: "day" # Please check README.md for limit types
            # CREATE_PARITY_FILES: TRUE # Uncomment if you want parity files to repair bitrot in the future
        secrets:
            - rcon_password

secrets:
    rcon_password:
        file: ./rcon_password.txt